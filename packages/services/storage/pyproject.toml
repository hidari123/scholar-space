[project]
name = "scholarspace-storage"
version = "0.1.0"
description = "scholarspace 对象存储服务 —— 本地 / MinIO / S3"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

# ⚠️ 领域层零依赖 —— 只有标准库。
#    基础设施层需要 HTTP 客户端时才装。
dependencies = []

[project.optional-dependencies]
# ⚠️ httpx 是*可选* —— 领域层与应用层不需要它。
#    只有真正要发 HTTP 请求时才装。
http = [
    "httpx>=0.28",
    # ⚠️ **必选** —— S3 的 list 响应是 XML，
    # 没有它只能用不安全的标准库解析。
    "defusedxml>=0.7",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-defusedxml>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_storage"]

[tool.hatch.build.targets.sdist]
include = ["src/scholar_storage", "README.md"]

[tool.ruff]
extend = "./ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers --tb=short"
