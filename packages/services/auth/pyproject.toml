[project]
name = "scholarspace-auth"
version = "0.1.0"
description = "scholarspace 鉴权与管理员服务 —— 角色 / 权限 / 内部 JWT / 网关签名"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

# ⚠️ 领域层零依赖 —— 只有基础设施层需要外部库。
#    这与 identity-core 一样的原则：领域可复用。
dependencies = []

[project.optional-dependencies]
postgres = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_auth"]

[tool.hatch.build.targets.sdist]
include = ["src/scholar_auth", "README.md"]

[tool.ruff]
extend = "./ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers --tb=short"
