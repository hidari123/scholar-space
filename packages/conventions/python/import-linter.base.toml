# import-linter - dependency guardrails (base template)
#
# IMPORTANT: This file MUST stay ASCII-only.
#
# Reason: import-linter reads this file with the system locale codec
# (GBK on Chinese Windows). Non-ASCII characters cause
# "'gbk' codec can't decode byte ...".
#
# Use English comments here. Chinese docs live in docs/06-architecture-guardrails.md.
#
# NOTE: This is a TEMPLATE. The effective file is each subproject's
#       importlinter.ini, generated by `cli new` with <pkg> replaced.
#
# How to use:
#   [importlinter]
#   root_package = "<PACKAGE>"
#   include_external_packages = true
#
#   [[importlinter:contract]]
#   name = "G1 layers"
#   type = "layers"
#   layers = [
#       "<pkg>.interfaces",
#       "<pkg>.infrastructure",
#       "<pkg>.application",
#       "<pkg>.domain",
#   ]

[importlinter]
root_package = "<PACKAGE>"
include_external_packages = true
exhaustive = true

# ============================================================================
# G1 - Four-layer architecture
# ============================================================================
[[importlinter:contract]]
name = "G1 layers: interfaces -> infrastructure -> application -> domain"
type = "layers"
layers = [
    "<pkg>.interfaces",
    "<pkg>.infrastructure",
    "<pkg>.application",
    "<pkg>.domain",
]
exhaustive = true

# ============================================================================
# G2 - domain layer has zero external dependencies
# ============================================================================
[[importlinter:contract]]
name = "G2 domain layer has zero external dependencies"
type = "forbidden"
source_modules = ["<pkg>.domain"]
forbidden_modules = [
    # web frameworks
    "fastapi", "starlette", "flask",
    # data
    "sqlalchemy", "alembic",
    # network
    "requests", "httpx", "aiohttp",
    # infrastructure
    "redis", "minio", "boto3", "celery", "arq",
    # config
    "pydantic_settings", "dotenv",
]

# ============================================================================
# G3 - application does not import infrastructure
# ============================================================================
[[importlinter:contract]]
name = "G3 application does not depend on infrastructure"
type = "forbidden"
source_modules = ["<pkg>.application"]
forbidden_modules = ["<pkg>.infrastructure"]

# ============================================================================
# G4 - interfaces does not import implementation details
# ============================================================================
[[importlinter:contract]]
name = "G4 interfaces does not depend on infrastructure"
type = "forbidden"
source_modules = ["<pkg>.interfaces"]
forbidden_modules = ["<pkg>.infrastructure"]

[[importlinter:contract]]
name = "G5 domain does not depend on application"
type = "forbidden"
source_modules = ["<pkg>.domain"]
forbidden_modules = [
    "<pkg>.application",
    "<pkg>.infrastructure",
    "<pkg>.interfaces",
]

# ============================================================================
# Cross-package constraints
# ============================================================================
# Example: slides must not depend on paper / community / orchestra
# [[importlinter:contract]]
# name = "slides does not depend on paper / community / orchestra"
# type = "forbidden"
# forbidden_modules = ["paper", "community", "orchestra"]
