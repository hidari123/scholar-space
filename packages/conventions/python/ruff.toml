# ruff — lint + format
# 规范唯一来源：scholarspace/packages/conventions/python/ruff.toml
#
# 用法（子项目）：
#   [tool.ruff]
#   extend = "../scholarspace/packages/conventions/python/ruff.toml"

target-version = "py313"
line-length = 100

# ── 选用的规则集 ─────────────────────────────────────
[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort（import 排序）
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "A",     # builtin shadowing
    "C4",    # comprehensions
    "DTZ",   # datetime timezone
    "T20",   # print（禁 print）
    "SIM",   # simplify
    "PTH",   # pathlib（禁 os.path）
    "RUF",   # ruff 专属
    "ASYNC", # async 陷阱
    "S",     # bandit 安全
    "BLE",   # blind except
    "TRY",   # try/except 规范
    "PERF",  # 性能
    "ANN",   # 类型标注
    "D",     # docstring
    "ARG",   # 未使用参数
    "PL",    # pylint 子集
    "ERA",   # 注释掉的代码
]

ignore = [
    # ── 与既有代码风格冲突，先放开，后续逐步收紧 ──
    "D203",   # 与 D211 冲突
    "D213",   # 与 D212 冲突
    "ANN401", # Any 类型：领域层偶尔需要（后续用泛型替代）
    "COM812", # 缺尾逗号（与 formatter 冲突）
    "ISC001", # 与 formatter 冲突
    "E501",   # 行长由 formatter 管
]

# ── per-file 豁免 ────────────────────────────────────
[lint.per-file-ignores]
# 测试文件：允许断言、允许魔法值
"tests/**" = ["S101", "PLR2004", "D103", "D100", "ANN201", "ANN001"]
# 迁移脚本
"alembic/**" = ["D103", "ANN"]
# 初始化文件
"__init__.py" = ["F401"]
# 领域实体：dataclass 的字段不是构造函数
"*/domain/entities.py" = ["D101"]

# ── 复杂度 ───────────────────────────────────────────
[lint.mccabe]
max-complexity = 12

# ── isort ────────────────────────────────────────────
[lint.isort]
known-first-party = ["scholarspace", "core", "auth", "llm", "storage", "events",
                     "billing", "paper", "slides", "orchestra", "community", "federation"]
combine-as-imports = true

# ── pydocstyle ───────────────────────────────────────
[lint.pydocstyle]
convention = "google"

# ── flake8-bandit 安全规则的白名单 ─────────────────────
[lint.flake8-bandit]
# 测试与迁移中允许 assert / subprocess
[lint.per-file-ignores."tests/**"] = ["S101"]
