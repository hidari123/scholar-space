# pytest — 测试配置
# 规范唯一来源：scholarspace/packages/conventions/python/pytest.ini
#
# 用法（子项目 pyproject.toml）：
#   [tool.pytest.ini_options]
#   # 引用本文件，或直接复制以下配置

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# ── 标记 ──────────────────────────────────────────────
markers =
    unit: 纯单元测试（无 IO）
    integration: 集成测试（需 DB/Redis/MinIO）
    contract: 契约测试（OpenAPI/事件格式）
    slow: 慢速测试
    requires_llm: 需要真实 LLM 调用（默认跳过）

# ── 输出 ──────────────────────────────────────────────
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short

# ── 默认跳过标记 ──────────────────────────────────────
addopts = -m "not requires_llm"

# ── 覆盖率 ────────────────────────────────────────────
# 门禁阈值（见 docs/06-架构护栏.md G20）
#   domain ≥90% / application ≥80%
# addopts = --cov=src --cov-report=term-missing --cov-fail-under=80

filterwarnings =
    error
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:fastapi.*
