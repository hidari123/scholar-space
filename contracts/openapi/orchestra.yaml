# scholarspace 编排服务契约
#
# ⚠️ 契约是唯一真相源（ADR-0011 原则 2：契约先行）。
# 生成来源：scholarspace-orchestra/libs/orchestra-http

openapi: 3.1.0
info:
  title: scholarspace Orchestra API
  version: 0.1.0
  description: |
    流程编排引擎的 HTTP 接口。

    ⚠️ **节点市场是「学术节点」** ——
    通过 Port 接口调用 paper/slides/community，
    **不直接 import**（由 apps/gateway 注入实现）。

paths:
  /api/v1/orchestra/flows:
    post:
      operationId: createFlow
      summary: 创建流程
      tags: [flows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlowRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowResponse'
        '422':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: listFlows
      summary: 列出流程
      tags: [flows]
      responses:
        '200':
          description: 流程列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlowResponse'

  /api/v1/orchestra/flows/{flow_id}:
    parameters:
      - $ref: '#/components/parameters/FlowId'
    get:
      operationId: getFlow
      summary: 取流程
      tags: [flows]
      responses:
        '200':
          description: 流程详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteFlow
      summary: 删除流程（幂等）
      tags: [flows]
      responses:
        '204':
          description: 已删除
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/orchestra/runs:
    post:
      operationId: createRun
      summary: 触发运行
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '202':
          description: 已接受（异步执行）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: listRuns
      summary: 列出运行
      tags: [runs]
      responses:
        '200':
          description: 运行列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunResponse'

  /api/v1/orchestra/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      summary: 取运行
      tags: [runs]
      responses:
        '200':
          description: 运行详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/orchestra/runs/{run_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: cancelRun
      summary: 取消运行
      tags: [runs]
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/orchestra/runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: streamRunEvents
      summary: 订阅运行事件（SSE）
      tags: [events]
      responses:
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/orchestra/sessions:
    post:
      operationId: createSession
      summary: 创建会话
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422':
          $ref: '#/components/responses/BadRequest'

  /api/v1/orchestra/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      summary: 取会话
      tags: [sessions]
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/orchestra/sessions/{session_id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: appendSessionMessage
      summary: 追加消息
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendMessageRequest'
      responses:
        '200':
          description: 更新后的会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/orchestra/nodes:
    get:
      operationId: listNodes
      summary: 列出可用节点
      tags: [nodes]
      responses:
        '200':
          description: 节点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeSpecResponse'

  /api/v1/orchestra/nodes/categories:
    get:
      operationId: listNodeCategories
      summary: 列出节点分类
      tags: [nodes]
      responses:
        '200':
          description: 分类列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

components:
  schemas:
    CreateFlowRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeSpec'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeSpec'

    NodeSpec:
      type: object
      required: [node_id, node_type]
      properties:
        node_id:
          type: string
        node_type:
          type: string
          description: 节点类型（llm / tool / branch / merge / 学术节点）
        config:
          type: object
          additionalProperties: true

    EdgeSpec:
      type: object
      required: [from_node, to_node]
      properties:
        from_node:
          type: string
        to_node:
          type: string
        condition:
          type: string

    FlowResponse:
      type: object
      required: [flow_id, name, version, status, nodes, edges]
      properties:
        flow_id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, active, archived]
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeSpec'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeSpec'
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time

    CreateRunRequest:
      type: object
      required: [flow_id]
      additionalProperties: false
      properties:
        flow_id:
          type: string
        inputs:
          type: object
          additionalProperties: true

    RunResponse:
      type: object
      required: [run_id, flow_id, status, created_at]
      properties:
        run_id:
          type: string
        flow_id:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        outputs:
          type: object
          additionalProperties: true
        error:
          type: [string, 'null']
        failed_node_id:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time

    CreateSessionRequest:
      type: object
      required: [flow_id]
      additionalProperties: false
      properties:
        flow_id:
          type: string
        title:
          type: string
          maxLength: 200

    AppendMessageRequest:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
        role:
          type: string
          default: user
          enum: [user, assistant, system, tool]

    SessionResponse:
      type: object
      required: [session_id, flow_id, messages, created_at]
      properties:
        session_id:
          type: string
        flow_id:
          type: string
        title:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SessionMessage'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time

    SessionMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
        created_at:
          type: [string, 'null']
          format: date-time

    NodeSpecResponse:
      type: object
      required: [node_type, category, display_name]
      properties:
        node_type:
          type: string
        category:
          type: string
        display_name:
          type: string
        description:
          type: string
        icon:
          type: string
        ports:
          type: array
          items:
            $ref: '#/components/schemas/PortSpec'

    PortSpec:
      type: object
      required: [name, port_type]
      properties:
        name:
          type: string
        port_type:
          type: string
        required:
          type: boolean
          default: true

  parameters:
    FlowId:
      name: flow_id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ErrorResponse'
