# mypy - project config
#
# NOTE: mypy has NO config-inheritance mechanism.
#   - `[tool.mypy] extends` in pyproject.toml -> "Unrecognized option"
#   - `[mypy] include` in mypy.ini            -> "Unrecognized option"
#
# The base file is COPIED here by `cli new`; `cli sync` refreshes it.
# Base source: packages/conventions/python/mypy.ini
# NOTE: base must be ASCII-only (mypy reads .ini with system locale codec).

[mypy]
python_version = 3.13
strict = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
strict_equality = True
show_error_codes = True
pretty = True
namespace_packages = True
explicit_package_bases = True
plugins = pydantic.mypy
mypy_path = src
exclude = (?x)(^.*/migrations/.*,|^.*/alembic/.*,|^.*/build/.*,|^.*/dist/.*)

[mypy-*.domain.*]
disallow_any_explicit = False
disallow_untyped_defs = True

[mypy-*.tests.*]
disallow_untyped_defs = False
disallow_untyped_decorators = False
disallow_incomplete_defs = False
warn_unused_ignores = False

[mypy-*.alembic.*]
disallow_untyped_defs = False

[mypy-yarllib.*]
ignore_missing_imports = True

[mypy-magic.*]
ignore_missing_imports = True

# ---- project-specific overrides ----
[mypy-example_service.domain.*]
disallow_any_explicit = False
