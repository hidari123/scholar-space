[project]
name = "scholarspace-example-service"
version = "0.1.0"
description = "示例 Python 子项目 —— 验证 conventions extends 是否真正生效"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_service"]

# ══════════════════════════════════════════════════════════
# 规范继承 —— 这是本示例的核心目的
# ══════════════════════════════════════════════════════════
[tool.ruff]
extend = "../../packages/conventions/python/ruff.toml"

# ⚠️ mypy 不支持在 pyproject.toml 里 extends —— 只支持 .ini/.cfg 文件
#    （mypy 会报 "Unrecognized option: extends"）
#    正确做法：项目根放一个 mypy.ini，用 include 引入 conventions 的配置。
#    见 mypy.ini（本文件）
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true
