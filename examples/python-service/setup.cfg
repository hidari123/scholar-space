[importlinter]
root_package = example_service
include_external_packages = True

[importlinter:contract:1]
name = G1 layers: interfaces -> infrastructure -> application -> domain
type = layers
layers =
    example_service.interfaces
    example_service.infrastructure
    example_service.application
    example_service.domain

[importlinter:contract:2]
name = G2 domain layer has zero external dependencies
type = forbidden
source_modules =
    example_service.domain
forbidden_modules =
    fastapi
    starlette
    flask
    sqlalchemy
    alembic
    requests
    httpx
    aiohttp
    redis
    minio
    boto3
    celery
    arq
    pydantic_settings
    dotenv

[importlinter:contract:3]
name = G3 application does not depend on infrastructure
type = forbidden
source_modules =
    example_service.application
forbidden_modules =
    example_service.infrastructure

[importlinter:contract:4]
name = G4 interfaces does not depend on infrastructure
type = forbidden
source_modules =
    example_service.interfaces
forbidden_modules =
    example_service.infrastructure

[importlinter:contract:5]
name = G5 domain does not depend on application
type = forbidden
source_modules =
    example_service.domain
forbidden_modules =
    example_service.application
    example_service.infrastructure
    example_service.interfaces
