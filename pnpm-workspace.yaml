packages:
  # ── 主项目内的包 ─────────────────────────────────────
  - 'packages/*'
  - 'apps/*'
  - 'tools/*'
  - 'cli'

  # ── 示例包（验证 conventions 可用性）──────────────────
  - 'examples/*'

# 独立子项目（polyrepo）在各自仓内独立管理 workspace。
# 本地联调时用 `scripts/dev-setup.mjs` 克隆到 ../scholarspace-<name>，
# 各子包内用相对路径引用主项目的 packages/conventions。
